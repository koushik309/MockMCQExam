name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Create Gradle wrapper
        run: gradle wrapper --gradle-version 8.9
      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MockMCQExam.apk
          test -s MockMCQExam.apk
          sha256sum MockMCQExam.apk > MockMCQExam.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: MockMCQExam-Apk
          path: |
            MockMCQExam.apk
            MockMCQExam.apk.sha256
          if-no-files-found: error
          retention-days: 30
